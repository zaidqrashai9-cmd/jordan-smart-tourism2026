plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'jo.media.monitor'
 compileSdk 35
 defaultConfig {
  applicationId 'jo.media.monitor'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '1.0'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
 defaultConfig {
  version '3.11'
  pip { install 'trafilatura==2.3.1'; install 'googlenewsdecoder==0.2.2' }
 }
}
dependencies {
 implementation 'androidx.work:work-runtime:2.10.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
