plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'jo.media.monitor'
 compileSdk 35
 defaultConfig {
  applicationId 'jo.media.monitor'
  minSdk 26
  targetSdk 35
  versionCode 2
  versionName '1.1'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
 defaultConfig {
  version '3.11'
  pip { install 'trafilatura==2.0.0'; install 'lxml==5.3.0'; install 'lxml_html_clean==0.4.3'; install 'htmldate==1.9.3'; install 'justext==3.0.2'; install 'dateparser==1.2.0'; install 'regex==2023.10.3' }
 }
}
dependencies {
 implementation 'androidx.work:work-runtime:2.10.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
