name: MediaMonitor
options:
  bundleIdPrefix: jo.mediaunit
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '2.0'
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ''
targets:
  MediaMonitor:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    resources: [Resources]
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: رصد وحدة الاعلام
        CFBundleIdentifier: jo.mediaunit.monitor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jo.mediaunit.monitor
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
  MediaMonitorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: MediaMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  MediaMonitorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MediaMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  MediaMonitor:
    build:
      targets:
        MediaMonitor: all
    test:
      targets: [MediaMonitorTests, MediaMonitorUITests]
