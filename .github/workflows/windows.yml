name: Build Windows application
on:
  workflow_dispatch:
  push:
    paths:
      - monitor.py
      - .github/workflows/windows.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile monitor.py
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0 trafilatura==2.3.1 googlenewsdecoder==0.2.2
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm --clean --onedir --noupx --windowed --collect-all trafilatura --collect-all googlenewsdecoder --collect-all justext --collect-all dateparser --collect-all htmldate --collect-all courlan --name JordanTourismMonitor monitor.py
      - name: Smoke test packaged executable
        run: |
          $p = Start-Process -FilePath dist/JordanTourismMonitor/JordanTourismMonitor.exe -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged executable failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: JordanTourismMonitor-Windows-Portable
          path: dist/JordanTourismMonitor/
          if-no-files-found: error
          retention-days: 7
