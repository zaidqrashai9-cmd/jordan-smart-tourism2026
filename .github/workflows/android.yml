name: Build Android app
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MediaUnitMonitor-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test Python runtime on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 180
          arch: x86_64
          working-directory: android
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            gradle connectedDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n jo.media.monitor/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-ui.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: |
            android/android-ui.png
            android/app/build/reports/androidTests/
          retention-days: 7
