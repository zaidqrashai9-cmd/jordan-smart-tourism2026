name: Collect Jordan tourism news
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: tourism-shared-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install trafilatura==2.3.1 googlenewsdecoder==0.2.2
      - name: Collect public news and authorized social sources
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python monitoring/collect.py
      - name: Persist only public collected feed
        run: |
          git config user.name 'Tourism Monitor'
          git config user.email 'monitor@users.noreply.github.com'
          git restore ios/Resources/news.json ios/Resources/queries.json
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public tourism feed [skip ci]'
            git pull --rebase origin main
            git push origin main
          fi
